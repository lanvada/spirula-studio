name: CI

on:
  push:
    branches: [master, 'pin/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Source lints
        run: |
          bash tools/check_ss_prefix.sh
          bash tools/check_i18n.sh
          bash tools/check_file_macro.sh
          bash tools/check_comments.sh
          bash tools/check_private_paths.sh
          python3 tools/check_font_coverage.py
          python3 tools/check_winmacro.py

      - name: Generated files are current
        run: |
          python3 tools/codegen/generate_headers.py
          python3 tools/codegen/generate_kernel_instantiation.py
          python3 tools/codegen/generate_backend_api.py
          git diff --exit-code || {
            echo "::error::src/generated, src/instantiations or src/backend/api is behind tools/codegen"
            exit 1
          }

      - name: Comment budget
        if: github.event_name == 'pull_request'
        run: |
          git reset --soft ${{ github.event.pull_request.base.sha }}
          python3 tools/check_comment_length.py

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libvulkan-dev libgl1-mesa-dev xorg-dev
          sudo apt install -y libwayland-dev libwayland-bin wayland-protocols libxkbcommon0 libxkbcommon-x11-0 libxkbcommon-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev spirv-tools

      - uses: actions/cache@v4
        with:
          path: |
            build_vulkan/slang-*
            build_vulkan/Vulkan-Headers-*
          key: fetched-linux-${{ hashFiles('cmake/SsSlang.cmake', 'cmake/SsVulkan.cmake') }}

      - name: Build
        run: bash build_develop.bash -DSS_BACKEND=vulkan -DSS_ENABLE_PATENTED=ON

      - name: Smoke
        run: ./build_vulkan/spirula train --help

      # The selection the browser module (the wasm job) is held to, natively.
      - name: Selection parity
        run: ./build_vulkan/select_parity_test viewer/test/select-fixture.json viewer/test/select-fixture.expected.json

      - name: Package
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) VERSION=${REF_NAME#v} ;;
            *) VERSION=$(git rev-parse --short=7 HEAD) ;;
          esac
          ASSET=spirula-$VERSION-ubuntu-vulkan-x86_64.zip
          zip -j "$ASSET" build_vulkan/spirula
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ env.ASSET }}
          archive: false
          retention-days: 14

  # The frame selection as a WebAssembly module (viewer/README.md). A push to a
  # pin/ branch also publishes it as the release wasm-<sha7>, which a consumer
  # pinning that commit fetches and checks against SHA256SUMS.
  wasm:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      EMSDK_VERSION: 6.0.13
    steps:
      - uses: actions/checkout@v4

      # Inside the checkout, so named build-*: the source lints the build runs
      # skip that (.gitignore, tools/check_winmacro.py).
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: build-emsdk

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build
        run: |
          emcmake cmake -S viewer -B viewer/build -DCMAKE_BUILD_TYPE=Release
          cmake --build viewer/build --target ss_select -j4

      - name: Test
        run: node --test viewer/test/select.test.mjs

      # An npm-style tarball: a consumer installs it from the release URL, its
      # lockfile holds the integrity, and "spirula" names the tree it came from.
      - name: Package
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          SHA=$(git rev-parse HEAD)
          SHA7=$(git rev-parse --short=7 HEAD)
          VERSION=$(sed -n 's/^set(SS_VERSION "\(.*\)")$/\1/p' cmake/SsOptions.cmake)
          test -n "$VERSION"
          PKG=ss_select-$SHA7.tgz
          mkdir -p pkg/package/conformance
          cp viewer/js/ss_select.js viewer/js/ss_select.wasm viewer/js/ss_select.d.ts LICENSE pkg/package/
          cp viewer/test/select-replay.mjs viewer/test/select-replay.d.mts \
             viewer/test/select-fixture.json viewer/test/select-fixture.expected.json pkg/package/conformance/
          cat > pkg/package/package.json <<EOF
          {
            "name": "ss-select",
            "version": "$VERSION-g$SHA7",
            "description": "The frame selection of spirula sam extract, as a WebAssembly module",
            "license": "GPL-3.0-only",
            "repository": { "type": "git", "url": "$REPO_URL.git" },
            "type": "module",
            "exports": {
              ".": { "types": "./ss_select.d.ts", "default": "./ss_select.js" },
              "./ss_select.wasm": "./ss_select.wasm",
              "./conformance/*": "./conformance/*",
              "./package.json": "./package.json"
            },
            "spirula": { "version": "$VERSION", "commit": "$SHA", "emsdk": "$EMSDK_VERSION" }
          }
          EOF
          tar -czf "$PKG" -C pkg package
          sha256sum "$PKG" > SHA256SUMS
          echo "SHA7=$SHA7" >> "$GITHUB_ENV"
          echo "PKG=$PKG" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: ss_select-${{ env.SHA7 }}
          path: |
            ${{ env.PKG }}
            SHA256SUMS
          retention-days: 14

      # Not `v`: that tag would start the release job below. A dispatch on a pin
      # branch publishes too: a release lost, or a push Actions was off for, is redone.
      - name: Publish
        if: startsWith(github.ref, 'refs/heads/pin/') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG=wasm-$SHA7
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" \
              --notes "ss_select built from $GITHUB_SHA with emsdk $EMSDK_VERSION"
          gh release upload "$TAG" "$PKG" SHA256SUMS --clobber

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: brew install cmake ninja libomp

      - uses: actions/cache@v4
        with:
          path: |
            build/slang-*
            build/MoltenVK-*
          key: fetched-macos-${{ hashFiles('cmake/SsSlang.cmake', 'cmake/SsVulkan.cmake') }}

      - name: Build
        shell: bash
        run: |
          bash build_develop.bash -DSS_BACKEND=vulkan -DSS_ENABLE_PATENTED=ON 2>&1 | tee configure.log

      - name: OpenMP was found
        run: grep -q "Found OpenMP" configure.log

      - name: Smoke
        run: ./build/spirula train --help

      - name: Package
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          cmake --build build --target macos_dmg
          case "$GITHUB_REF" in
            refs/tags/v*) VERSION=${REF_NAME#v} ;;
            *) VERSION=$(git rev-parse --short=7 HEAD) ;;
          esac
          ASSET=spirula-$VERSION-macos-vulkan-arm64.dmg
          mv "build/Spirula Studio.dmg" "$ASSET"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ env.ASSET }}
          archive: false
          retention-days: 14

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Vulkan SDK
        shell: pwsh
        run: |
          curl.exe -sSL -o vulkan_sdk.exe https://sdk.lunarg.com/sdk/download/1.4.357.0/windows/vulkan_sdk.exe
          $p = Start-Process -FilePath .\vulkan_sdk.exe -NoNewWindow -Wait -PassThru `
               -ArgumentList '--root','C:\VulkanSDK','--accept-licenses','--default-answer','--confirm-command','install'
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          "VULKAN_SDK=C:\VulkanSDK" >> $env:GITHUB_ENV

      - name: Build
        shell: cmd
        run: build_develop.bat -DSS_BACKEND=vulkan -DSS_ENABLE_PATENTED=ON

      - name: Smoke
        shell: cmd
        run: build_vulkan\spirula.exe train --help

      - name: Package
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:REF_NAME.Substring(1) } else { git rev-parse --short=7 HEAD }
          $asset = "spirula-$version-windows-vulkan-x86_64.zip"
          Compress-Archive -Path build_vulkan\spirula.exe -DestinationPath $asset
          "ASSET=$asset" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ env.ASSET }}
          archive: false
          retention-days: 14

  # Runs after a partial failure too, so "Re-run failed jobs" finishes the set.
  release:
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: spirula-*
          path: assets
          merge-multiple: true
          skip-decompress: true

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l assets
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --draft --title "$TAG" --notes ""
          gh release upload "$TAG" assets/* --clobber
